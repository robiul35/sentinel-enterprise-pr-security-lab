id: subprocess-shell-true-python
language: python
severity: error
message: |
  Potential command injection: subprocess called with shell=True.
  Avoid shell=True for untrusted input and use argument arrays.
rule:
  any:
    - pattern: subprocess.check_output($CMD, shell=True, ...)
    - pattern: subprocess.run($CMD, shell=True, ...)
    - pattern: subprocess.Popen($CMD, shell=True, ...)