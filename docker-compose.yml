version: "3.9"
services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - MCP_URL=http://mcp-server:8100
    depends_on:
      - backend
      - mcp-server
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./app.db
  mcp-server:
    build: ./backend/services/mcp-server
    ports:
      - "8100:8100"
